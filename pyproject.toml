[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astro-night-planner"
version = "0.1.0"
description = "Astronomy night-planning tool: is tonight worth going out, and what should I point at?"
requires-python = ">=3.11"
dependencies = [
    "skyfield>=1.49",
    "timezonefinder>=6.5",
    "pyyaml>=6.0",
    "typer>=0.12",
    # zoneinfo has no system tz database on Windows.
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
planner = "cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["engine", "cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: test requires network access to an external reference source",
]
