# Observing sites.
#
# This file ships EMPTY on purpose. The planner will not assume a location for
# you: every answer it gives -- when it gets dark, what clears your horizon,
# which objects are bright enough for your sky -- depends entirely on where you
# are standing, and a plausible-looking default for somebody else's back garden
# is worse than no answer at all.
#
# Add a site from the site menu in the web UI, which can place one from a map,
# a place name, or raw coordinates. Or add one here by hand:
#
# default: home
# locations:
#   home:
#     name: "Back garden"
#     lat: 40.7608
#     lon: -111.8910
#     elevation_m: 1288
#
#     # Bortle class, 1-9. Optional: leave it out and a light-pollution atlas
#     # fills it in if one is configured (see the README), and failing that the
#     # planner says outright that it is assuming Bortle 5 rather than pretending
#     # to know. Anything you put here is treated as YOUR measurement and is
#     # never overwritten by the atlas.
#     bortle: 8
#
#     # Obstruction horizon. Either a preset (flat | hilly | trees | ridge |
#     # valley), a preset pointed where the obstruction actually is
#     # ({preset: ridge, facing: 250}), or a measured azimuth->altitude map
#     # ({0: 18, 90: 5, 180: 5, 270: 22}). The presets are GENERIC assumptions,
#     # not a survey of your site, and are labelled as such throughout.
#     horizon: {preset: ridge, facing: 250}
#
# Sites you add through the web UI are kept in your browser, never written
# here, so this file stays yours; a browser imports the sites here on its first
# visit. Your own sites can also go in
# config/locations.local.yaml, which is gitignored -- worth doing, because an
# observing site is often a home address to four decimal places.

locations: {}
